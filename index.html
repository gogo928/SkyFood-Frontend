<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приложение SkyFood</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        p { color: #7f8c8d; font-size: 14px; }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
            margin-top: 15px;
        }
        button:hover { background-color: #2980b9; }
        .status-box {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            display: none;
        }
        .success { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .error { background-color: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
    </style>
</head>
<body>

<div class="card">
    <h1>🚀 Приложение SkyFood</h1>
    <p>Тестовая облачная инфраструктура успешно развернута!</p>
    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
    
    <button onclick="checkBackend()">Проверить связь с сервером</button>
    
    <div id="statusBox" class="status-box"></div>
</div>

<script>
    async function checkBackend() {
        const statusBox = document.getElementById('statusBox');
        statusBox.style.display = 'block';
        statusBox.className = 'status-box'; // сброс стилей
        statusBox.innerText = 'Отправка запроса на бэкенд...';

        try {
            // Читаем переменную из настроек Vercel. Если её нет, подставится адрес нашего Java-сервера
            const backendUrl = window.env?.VITE_API_URL || 'https://onrender.com';
            
            // Отправляем запрос на тестовый эндпоинт Java, который мы написали ранее
            const response = await fetch(`${backendUrl}/api/test-db`);
            const data = await response.json();
            
            if (data.status === 'success') {
                statusBox.classList.add('success');
                statusBox.innerHTML = `🟢 ${data.message}<br><small>Время БД: ${data.dbTime}</small>`;
            } else {
                statusBox.classList.add('error');
                statusBox.innerHTML = `🔴 Бэк ответил, но база выдала ошибку:<br><small>${data.detail}</small>`;
            }
        } catch (error) {
            statusBox.classList.add('error');
            statusBox.innerHTML = `🔴 Не удалось достучаться до Java-бэкенда.<br><small>Возможно, сервер спит. Подождите 30 секунд и нажмите кнопку еще раз.</small>`;
            console.error(error);
        }
    }
</script>

<!-- Скрипт для корректного проброса переменных окружения из Vercel во фронтенд -->
<script>
    window.env = {
        VITE_API_URL: "https://skyfood-95ma.onrender.com" 
    };
</script>
</body>
</html>
