<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Витрина SkyFood</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #2c3e50; margin-bottom: 30px; }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            width: 100%;
        }
        .dish-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }
        .dish-card:hover { transform: translateY(-5px); }
        .dish-name { font-size: 20px; font-weight: bold; color: #2c3e50; margin: 0 0 10px 0; }
        .dish-desc { font-size: 14px; color: #7f8c8d; line-height: 1.4; margin: 0 0 20px 0; }
        .dish-footer { display: flex; justify-content: space-between; align-items: center; }
        .dish-price { font-size: 18px; font-weight: bold; color: #e67e22; }
        .buy-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .buy-btn:hover { background-color: #27ae60; }
        .status-box { margin-bottom: 20px; color: #7f8c8d; font-size: 14px; }
    </style>
</head>
<body>

    <h1>🚀 Доставка еды SkyFood</h1>
    <div id="status" class="status-box">Загрузка меню из PostgreSQL...</div>

    <!-- Сюда JavaScript автоматически вставит блюда из базы данных -->
    <div id="menu" class="menu-grid"></div>

<script>
    async function loadMenu() {
        const menuContainer = document.getElementById('menu');
        const statusBox = document.getElementById('status');
        
        try {
            // Подключаем наш живой Java-сервер на Render
            const backendUrl = window.env?.VITE_API_URL || 'https://onrender.com';
            
            // Вызываем новый эндпоинт, который мы прописали в Main.java
            const response = await fetch(`${backendUrl}/api/dishes`);
            const dishes = await response.json();
            
            statusBox.innerText = `🟢 Связь установлена. Загружено блюд из СУБД Neon: ${dishes.length}`;
            menuContainer.innerHTML = ''; // Очищаем контейнер

            // Динамически создаем карточки для каждого блюда из базы данных
            dishes.forEach(dish => {
                const card = document.createElement('div');
                card.className = 'dish-card';
                card.innerHTML = `
                    <div>
                        <h2 class="dish-name">${dish.name}</h2>
                        <p class="dish-desc">${dish.description}</p>
                    </div>
                    <div class="dish-footer">
                        <span class="dish-price">${dish.price} ₽</span>
                        <button class="buy-btn" onclick="alert('Вы заказали ${dish.name}!')">В корзину</button>
                    </div>
                `;
                menuContainer.appendChild(card);
            });

        } catch (error) {
            statusBox.innerHTML = '🔴 <span style="color: #c62828;">Ошибка загрузки меню. Проверьте логи бэкенда.</span>';
            console.error(error);
        }
    }

    // Запускаем загрузку сразу при открытии страницы
    window.onload = loadMenu;
</script>

<script>
    window.env = {
        VITE_API_URL: "https://skyfood-95ma.onrender.com" 
    };
</script>
</body>
</html>
